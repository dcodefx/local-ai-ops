# cpu_models.conf
#
# Her blok bir "alias:" satiriyla baslar. Yeni model eklemek icin ayni
# formatta yeni bir blok ekle, install_cpu_services.sh'i tekrar calistir.
#
# Zorunlu alanlar: alias, model_adı, model_dosya,  hf_repo
# Opsiyonel (varsayilan verilmisse atlanabilir): port (8080, litellm tek yerden), ctx_size (4096), threads (4),
#            threads_batch(4), extra_params,
#            engine (varsayilan: stock -> payload/engines/stock.sh, mainline ggml-org/llama.cpp)
#
# engine alani: bu model hangi llama.cpp derlemesiyle calistirilacak?
#   Standart GGUF quant'lar (Q4_K_M, Q8_0, IQ* vb.) icin engine belirtmeye gerek yok,
#   varsayilan "stock" kullanilir. Ozel/deneysel formatlar (ör. ternary/dusuk-bit GGUF)
#   stock llama.cpp'de ya hic acilmaz ya da sessizce yanlis sonuc uretir - byle bir model
#   icin payload/engines/ altinda ilgili profili (ör. prism-cpu) yazip burada
#   "engine:prism-cpu" ile referans verin. Profil dosyasi olusana kadar bu alani
#   kullanan bir blok EKLEMEYIN - install_cpu_services.sh bilinmeyen engine icin hata verir.
#  dflash_dosya:Qwen3.6-35B-A3B-DFlash-Q8_0.gguf
#  dflash_repo:pythoneer/qwen36-35b-a3b-dflash-llamacpp   # opsiyonel, boşsa hf_repo
#  dflash_type:draft-dflash  


# NVIDIA-Nemotron-3.5-Bolt-E4B
alias:nv-nem-3.5-bolt-e4b-q8
model_adı:nv-nem-3.5-bolt-e4b-q8
model_dosya:NVIDIA-Nemotron-3.5-Bolt-E4B-UD-Q8_K_XL.gguf
ctx_size:16384
threads:4
threads_batch:8
hf_repo:unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF
spec_type:draft-dflash
draft_dosya:dflash-NVIDIA-Nemotron-3.5-Bolt-E4B-Q8_0.gguf
extra_params:--ubatch-size 256 --batch-size 512 --parallel 1 --flash-attn on --jinja

# gemma-4-q8-mtp-12B-coder-fable5
alias:gm4-yux-12B-f-q8
model_adı:gm4-coding-12B-fa-c0m-2.5-q6
model_dosya:gemma4-v2-Q8_0.gguf
ctx_size:36864
threads:4
threads_batch:8
hf_repo:yuxinlu1/gemma-4-12B-agentic-fable5-composer2.5-v2-3.5x-tau2-GGUF
spec_type:draft-mtp
draft_dosya:gemma-4-12B-it-MTP-Q8_0.gguf
extra_params:--cache-type-k q4_0 --cache-type-v q8_0 -fa on --temp 1.0 --top-p 0.95 --top-k 64 --spec-draft-n-max 4

